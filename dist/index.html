<script>
(()=>{'use strict';const $=s=>document.querySelector(s),LIMIT=60,PREVIEW=2,KEY='campus-memory-challenge-rank-v1',SYMBOLS=['ginkgo','coin','wheat','book','moon','mountain','leaf','knot'],NAMES=['경제대학 문장','상평통보','벼 이삭','책','달','산','잎','매듭'];let phase='ready',opened=[],attempts=0,matched=0,deadline=0,started=0,elapsed=0,name='',timer=null,previewTimer=null,flipTimer=null,round=0;const fmt=n=>{n=Math.max(0,Math.floor(n));return[Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(v=>String(v).padStart(2,'0')).join(':')};const compare=(a,b)=>b.pairs-a.pairs||a.attempts-b.attempts||a.seconds-b.seconds||a.createdAt-b.createdAt;function records(){try{const list=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(list)?list.filter(r=>r&&typeof r.name==='string'&&Number.isFinite(r.pairs)&&Number.isFinite(r.attempts)&&Number.isFinite(r.seconds)):[]}catch{return[]}}

function begin(){name=$('#nickname').value.trim().slice(0,16);if(!name){$('#nickname').focus();return}$('#startOverlay').hidden=true;$('#game').inert=false;$('#playerName').textContent=name;phase='preview';const token=round,until=Date.now()+PREVIEW*1000;$('#board').classList.add('preview');$('#board').querySelectorAll('.card').forEach(c=>c.classList.add('open'));function preview(){if(token!==round)return;const left=Math.ceil((until-Date.now())/1000);$('#phase').textContent='문장의 위치를 기억해 주세요 · '+Math.max(0,left)+'초';if(left<=0){clearInterval(previewTimer);previewTimer=null;$('#board').classList.remove('preview');$('#board').querySelectorAll('.card').forEach(c=>c.classList.remove('open'));phase='playing';started=Date.now();deadline=started+LIMIT*1000;$('#phase').textContent='같은 문장의 카드 두 장을 선택해 주세요.';timer=setInterval(tick,100)}}preview();previewTimer=setInterval(preview,100)}
function tick(){if(phase!=='playing'&&phase!=='locked')return;const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('#clock').textContent=fmt(left);$('#clock').classList.toggle('urgent',left<=10);if(Date.now()>=deadline)finish(false)}
function flip(card){if(phase!=='playing')return;if(Date.now()>=deadline){finish(false);return}if(card.classList.contains('open')||card.classList.contains('matched'))return;card.classList.add('open');card.setAttribute('aria-label',NAMES[SYMBOLS.indexOf(card.dataset.symbol)]);opened.push(card);if(opened.length<2)return;attempts++;$('#attempts').textContent=attempts;const[a,b]=opened;if(a.dataset.symbol===b.dataset.symbol){a.classList.add('matched');b.classList.add('matched');a.disabled=b.disabled=true;matched++;$('#pairs').textContent=(8-matched)+'쌍';opened=[];if(matched===8)finish(true)}else{phase='locked';const token=round;flipTimer=setTimeout(()=>{if(token!==round||phase==='result')return;opened.forEach(c=>{c.classList.remove('open');c.setAttribute('aria-label','카드 '+c.dataset.position+', 뒤집혀 있음')});opened=[];phase='playing'},700)}}
function finish(clear){if(phase==='result')return;phase='result';elapsed=Math.min(LIMIT,Math.max(0,Math.floor((Date.now()-started)/1000)));cleanup();$('#game').inert=true;const record={id:Date.now()+'-'+Math.random().toString(36).slice(2,9),name,pairs:matched,attempts,seconds:elapsed,createdAt:Date.now()};const all=[...records(),record].sort(compare),rank=all.findIndex(r=>r.id===record.id)+1,top=all.slice(0,10);let saved=true;try{localStorage.setItem(KEY,JSON.stringify(top))}catch{saved=false}$('#resultDescription').textContent=clear?'모든 문장의 짝을 찾았습니다.':'제한 시간이 종료되었습니다.';$('#resultTime').textContent=fmt(elapsed);$('#resultAttempts').textContent=attempts+'회';$('#resultPairs').textContent=matched+' / 8';$('#rankMessage').textContent=name+' 님의 기록 · '+rank+'위';$('#storageError').hidden=saved;$('#rankList').replaceChildren(...top.map((r,i)=>{const li=document.createElement('li');li.className='rank-row'+(r.id===record.id?' current':'');const place=document.createElement('span');place.textContent=String(i+1).padStart(2,'0');const who=document.createElement('span');who.className='rank-name';who.textContent=r.name;const detail=document.createElement('span');detail.className='rank-meta';detail.textContent=r.pairs+'/8 · '+r.attempts+'회 · '+fmt(r.seconds);li.append(place,who,detail);return li}));$('#resultOverlay').hidden=false;$('#restart').focus({preventScroll:true})}
$('#startForm').addEventListener('submit',e=>{e.preventDefault();if(phase==='ready')begin()});$('#restart').addEventListener('click',()=>{ready();$('#nickname').focus({preventScroll:true})});document.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const overlay=phase==='ready'?$('#startOverlay'):phase==='result'?$('#resultOverlay'):null;if(!overlay)return;const focusable=[...overlay.querySelectorAll('input,button')].filter(x=>!x.disabled);const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});ready();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));})();
</script></body></html>
